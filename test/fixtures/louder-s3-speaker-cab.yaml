# ============================================================
# Louder ESP32-S3 (TAS5805M) - two-way active speaker cabinet
# ============================================================
# One board drives one cabinet through the TAS5805M DSP crossover:
#   Left output  -> tweeter  (Dayton DC28FT)      high-pass
#   Right output -> mid/bass (Tectonic TCP115)    low-pass
# Mixer mode MONO feeds both outputs with L+R, so one cabinet plays the full mix.
# For a stereo pair of cabinets use mixer_mode: LEFT on one board and RIGHT on the other.
#
# Board pins are from Sonocotta's esp32-audio-dock firmware
# (firmware/esphome/3-louder-esp32/louder-esp32-s3-idf-sendspin.yaml).
# The W5500 pins are the same in esparagus-media-center
# (firmware/esphome/12-louder-esparagus-plus-s3).
#
# For a TAS5825M board (e.g. Louder Esparagus Plus S3) set tas58xx_dac: TAS5825M
# and change the I2C and enable pins to the ones for that board.
#
# Requires ESPHome 2026.10.0 or later (Sendspin, network priority list).
# ============================================================

substitutions:
  name: louder-s3-cab
  friendly_name: Louder S3 Cab
  task_stack_in_psram: "true"

  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # TAS5805M
  tas58xx_enable_pin: GPIO17
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

  # W5500 Ethernet (shares SPI with the optional display header)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

  # Short sound played at boot so the DAC sees a stable I2S clock before the DSP is configured.
  # Use tas58xx_boot.flac instead for an audible boot sound while testing.
  sync_dac_i2s_sound: https://github.com/mrtoy-me/esphome-tas58xx/raw/main/components/tas58xx/silent_boot.flac

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  platformio_options:
    board_build.flash_mode: dio
  # The DAC only accepts DSP writes once it has an I2S clock. Playing the sync sound at boot starts it.
  # The crossover waits for the clock itself and keeps the DAC muted until it is written and verified.
  on_boot:
    priority: 220.0
    then:
      - media_player.play_media:
          id: external_media_player
          media_url: audio-file://startup_sync_sound

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

external_components:
  - source: github://craigmillard86/esphome-tas58xx@crossover
    components: [ tas58xx ]
    refresh: 0s

logger:
  level: DEBUG

api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

# ===== Network: Ethernet first, Wi-Fi as fallback =====
wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password
  # Wi-Fi power saving causes audio dropouts
  power_save_mode: none

ethernet:
  type: W5500
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
  miso_pin: ${spi_miso_pin}
  cs_pin: ${eth_cs_pin}
  interrupt_pin: ${eth_interrupt_pin}
  reset_pin: ${eth_reset_pin}
  # low SPI clock avoids receive buffer errors, still far more than a FLAC stream needs
  clock_speed: 8MHz

network:
  # ESPHome 2026.8+: needed when both wifi: and ethernet: are configured
  priority:
    - ethernet
    - wifi

http_request:

# ===== DAC =====
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: 400kHz

audio_dac:
  - platform: tas58xx
    id: external_dac
    tas58xx_dac: TAS5805M
    enable_pin: ${tas58xx_enable_pin}
    analog_gain: 0dB          # pick for your supply voltage, see the README
    dac_mode: BTL             # crossover needs BTL: one output per driver
    mixer_mode: MONO
    volume_max: 0dB
    volume_min: -60dB
    refresh_eq: AUTO
    update_interval: 5s
    # Defaults for first boot. The entities below save any change you make in Home Assistant.
    crossover:
      filter: LR4             # LR2, LR4, BW2 or BW4
      frequency: 2500Hz
      # the crossover can never go below this, also in Home Assistant
      # set it from the tweeter datasheet, 1800Hz is a cautious value for a 28mm dome
      tweeter_min_frequency: 1800Hz
      tweeter_channel: LEFT   # DC28FT on the left output, TCP115 on the right
      tweeter_gain: -3dB
      mid_gain: 0dB
      loudness: false
      loudness_reference: 0dB
      # speaker compensation, all off here: set them from Home Assistant once measured
      subsonic_frequency: 0Hz     # mid high-pass, e.g. 40Hz for a sealed TCP115
      baffle_width: 0             # cm, front baffle width for baffle step compensation
      baffle_placement: FREESTANDING
      tweeter_notch:
        frequency: 0Hz            # DC28FT breakup notch, gain must be negative
        gain: 0dB
        q: 5.0
      air_gain: 0dB               # tweeter high shelf at 10kHz
      linkwitz:                   # sealed box bass extension, set f0/q0 from a measurement
        f0: 0Hz
        q0: 0.707
        fp: 0Hz
        qp: 0.5
      headroom_compensation: false

select:
  - platform: tas58xx
    mixer_mode:
      name: Mixer Mode
    eq_mode:
      name: EQ Mode
    crossover_filter:
      name: Crossover Filter
    crossover_tweeter_channel:
      name: Tweeter Channel
    baffle_placement:
      name: Baffle Placement
    tweeter_peq_1_type:
      name: Tweeter PEQ 1 Type
    tweeter_peq_2_type:
      name: Tweeter PEQ 2 Type
    tweeter_peq_3_type:
      name: Tweeter PEQ 3 Type
    tweeter_peq_4_type:
      name: Tweeter PEQ 4 Type
    tweeter_peq_5_type:
      name: Tweeter PEQ 5 Type
    tweeter_peq_6_type:
      name: Tweeter PEQ 6 Type
    mid_peq_1_type:
      name: Mid PEQ 1 Type
    mid_peq_2_type:
      name: Mid PEQ 2 Type
    mid_peq_3_type:
      name: Mid PEQ 3 Type
    mid_peq_4_type:
      name: Mid PEQ 4 Type
    mid_peq_5_type:
      name: Mid PEQ 5 Type
    mid_peq_6_type:
      name: Mid PEQ 6 Type

number:
  - platform: tas58xx
    crossover_frequency:
      name: Crossover Frequency
    tweeter_gain:
      name: Tweeter Gain
    mid_gain:
      name: Mid Gain
    tweeter_delay:
      name: Tweeter Delay
    mid_delay:
      name: Mid Delay
    loudness_reference:
      name: Loudness Reference
    subsonic_frequency:
      name: Subsonic Filter
    baffle_width:
      name: Baffle Width
    tweeter_notch_frequency:
      name: Tweeter Notch Frequency
    tweeter_notch_gain:
      name: Tweeter Notch Gain
    tweeter_notch_q:
      name: Tweeter Notch Q
    air_gain:
      name: Air Shelf Gain
    linkwitz_f0:
      name: Linkwitz Box f0
    linkwitz_q0:
      name: Linkwitz Box Q0
    linkwitz_fp:
      name: Linkwitz Target fp
    linkwitz_qp:
      name: Linkwitz Target Qp
    # All six PEQ bands per driver, so a tuning tool (or you) can use every band.
    tweeter_peq_1_frequency:
      name: Tweeter PEQ 1 Frequency
    tweeter_peq_1_gain:
      name: Tweeter PEQ 1 Gain
    tweeter_peq_1_q:
      name: Tweeter PEQ 1 Q
    tweeter_peq_2_frequency:
      name: Tweeter PEQ 2 Frequency
    tweeter_peq_2_gain:
      name: Tweeter PEQ 2 Gain
    tweeter_peq_2_q:
      name: Tweeter PEQ 2 Q
    tweeter_peq_3_frequency:
      name: Tweeter PEQ 3 Frequency
    tweeter_peq_3_gain:
      name: Tweeter PEQ 3 Gain
    tweeter_peq_3_q:
      name: Tweeter PEQ 3 Q
    tweeter_peq_4_frequency:
      name: Tweeter PEQ 4 Frequency
    tweeter_peq_4_gain:
      name: Tweeter PEQ 4 Gain
    tweeter_peq_4_q:
      name: Tweeter PEQ 4 Q
    tweeter_peq_5_frequency:
      name: Tweeter PEQ 5 Frequency
    tweeter_peq_5_gain:
      name: Tweeter PEQ 5 Gain
    tweeter_peq_5_q:
      name: Tweeter PEQ 5 Q
    tweeter_peq_6_frequency:
      name: Tweeter PEQ 6 Frequency
    tweeter_peq_6_gain:
      name: Tweeter PEQ 6 Gain
    tweeter_peq_6_q:
      name: Tweeter PEQ 6 Q
    mid_peq_1_frequency:
      name: Mid PEQ 1 Frequency
    mid_peq_1_gain:
      name: Mid PEQ 1 Gain
    mid_peq_1_q:
      name: Mid PEQ 1 Q
    mid_peq_2_frequency:
      name: Mid PEQ 2 Frequency
    mid_peq_2_gain:
      name: Mid PEQ 2 Gain
    mid_peq_2_q:
      name: Mid PEQ 2 Q
    mid_peq_3_frequency:
      name: Mid PEQ 3 Frequency
    mid_peq_3_gain:
      name: Mid PEQ 3 Gain
    mid_peq_3_q:
      name: Mid PEQ 3 Q
    mid_peq_4_frequency:
      name: Mid PEQ 4 Frequency
    mid_peq_4_gain:
      name: Mid PEQ 4 Gain
    mid_peq_4_q:
      name: Mid PEQ 4 Q
    mid_peq_5_frequency:
      name: Mid PEQ 5 Frequency
    mid_peq_5_gain:
      name: Mid PEQ 5 Gain
    mid_peq_5_q:
      name: Mid PEQ 5 Q
    mid_peq_6_frequency:
      name: Mid PEQ 6 Frequency
    mid_peq_6_gain:
      name: Mid PEQ 6 Gain
    mid_peq_6_q:
      name: Mid PEQ 6 Q

switch:
  - platform: tas58xx
    enable_dac:
      name: Enable DAC
      id: enable_dac
      restore_mode: ALWAYS_ON
    tweeter_invert:
      name: Tweeter Invert Polarity
    mid_invert:
      name: Mid Invert Polarity
    loudness:
      name: Loudness
    tweeter_mute:
      name: Mute Tweeter
    mid_mute:
      name: Mute Mid
    headroom_compensation:
      name: Headroom Compensation

button:
  - platform: tas58xx
    crossover_export:
      name: Export Crossover to Log
    crossover_reset:
      name: Reset Crossover to YAML

binary_sensor:
  - platform: tas58xx
    have_fault:
      name: Any Faults
      exclude: CLOCK_FAULT
    left_channel_over_current:
      name: Tweeter Over Current
    right_channel_over_current:
      name: Mid Over Current
    over_temp_warning:
      name: Over Temperature Warning

sensor:
  - platform: tas58xx
    faults_cleared:
      name: Times Faults Cleared
    tweeter_peak_gain:
      name: Tweeter Peak Gain
    mid_peak_gain:
      name: Mid Peak Gain
    update_interval: 10s

# ===== Audio pipeline =====
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${i2s_lrclk_pin}
    i2s_bclk_pin: ${i2s_bclk_pin}

speaker:
  - platform: i2s_audio
    id: i2s_speaker_id
    i2s_audio_id: i2s_out
    sample_rate: 48000
    i2s_dout_pin: ${i2s_dout_pin}
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    # keep the I2S clock running so the DAC never loses it between tracks
    timeout: never
    buffer_duration: 100ms
    audio_dac: external_dac

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: i2s_speaker_id
    num_channels: 2
    task_stack_in_psram: ${task_stack_in_psram}
    source_speakers:
      - id: announcement_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixer_input
    task_stack_in_psram: ${task_stack_in_psram}
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixer_input
    task_stack_in_psram: ${task_stack_in_psram}
    sample_rate: 48000
    bits_per_sample: 16

audio_file:
  - id: startup_sync_sound
    file: ${sync_dac_i2s_sound}

sendspin:
  id: sendspin_hub
  task_stack_in_psram: ${task_stack_in_psram}

media_source:
  - platform: sendspin
    id: sendspin_source
    decode_memory: internal

  - platform: audio_file
    id: audio_file_source

  - platform: audio_http
    id: http_media_source
    buffer_size: 200000

  - platform: audio_http
    id: http_announcement_source
    buffer_size: 200000

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: "${friendly_name} Sendspin Player"

  - platform: speaker_source
    id: external_media_player
    name: "${friendly_name} Player"
    volume_increment: 0.05

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - http_announcement_source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - sendspin_source
        - http_media_source
        - audio_file_source

    # put the DAC to sleep when idle, the crossover is checked again on wake before unmuting
    on_play:
      - if:
          condition:
            switch.is_off: enable_dac
          then:
            switch.turn_on: enable_dac
    on_idle:
      - if:
          condition:
            switch.is_on: enable_dac
          then:
            switch.turn_off: enable_dac
    on_announcement:
      - if:
          condition:
            switch.is_off: enable_dac
          then:
            switch.turn_on: enable_dac
